<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamHub - Online Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>
*{box-sizing:border-box}

body{
    font-family:Arial,sans-serif;
    background:#f2f5fa;
    margin:0;
    padding:15px;
}

.container{
    max-width:750px;
    margin:20px auto;
    background:white;
    padding:22px;
    border-radius:12px;
}

h2{color:#183b70}

.top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid #ddd;
    padding-bottom:12px;
}

#timer{
    color:#d62828;
    font-weight:bold;
    font-size:22px;
}

.question{
    font-size:19px;
    margin:25px 0;
    font-weight:bold;
}

.option{
    display:block;
    background:#f3f6fb;
    padding:13px;
    margin:10px 0;
    border-radius:8px;
    cursor:pointer;
}

.option input{margin-right:10px}

button{
    padding:12px 18px;
    border:none;
    border-radius:7px;
    background:#1769d2;
    color:white;
    cursor:pointer;
    margin:5px;
}

button:disabled{
    background:#999;
}

#result{
    display:none;
    background:#e9f8ee;
    padding:18px;
    border-radius:10px;
}

#error{
    color:#c62828;
    background:#fff0f0;
    padding:10px;
    border-radius:6px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="container">

<h2 id="examTitle">Loading Exam...</h2>

<div class="top">
    <span id="questionCount">Loading Questions...</span>
    <span id="timer">00:00</span>
</div>

<div id="testArea" style="display:none">

    <div class="question" id="questionText"></div>

    <div id="options"></div>

    <div>
        <button id="previousBtn">Previous</button>
        <button id="nextBtn">Next</button>
        <button id="skipBtn">Skip</button>
        <button id="submitBtn" style="background:#198754">
            Submit Test
        </button>
    </div>

</div>

<div id="result">

    <h2>Test Completed!</h2>

    <div id="resultDetails"></div>

    <button onclick="location.href='./dashboard.html'">
        Go to Dashboard
    </button>

</div>

<p id="error"></p>

</div>

<script>
"use strict";

/* VARIABLES */

let examId = new URLSearchParams(location.search).get("exam");

let exam = null;
let questions = [];
let answers = {};
let currentIndex = 0;
let timeLeft = 0;
let timerInterval = null;
let submitting = false;


/* ELEMENTS */

const titleElement = document.getElementById("examTitle");
const timerElement = document.getElementById("timer");
const errorElement = document.getElementById("error");
const testArea = document.getElementById("testArea");


/* ERROR DISPLAY */

function showError(error){

    clearInterval(timerInterval);

    const message = error && error.message
        ? error.message
        : String(error);

    titleElement.textContent = "Test Load Failed";

    errorElement.textContent = "Error: " + message;

    console.error("ExamHub Error:",error);

}


/* INITIALIZE TEST */

async function initTest(){

    try{

        errorElement.textContent = "";

        titleElement.textContent = "Loading Exam...";

        if(!window.supabase){
            throw new Error("Supabase library load nahi hui.");
        }

        if(typeof supabaseClient === "undefined"){
            throw new Error("config.js load nahi hui.");
        }

        if(!examId || !/^\d+$/.test(examId)){
            throw new Error("Exam ID missing ya invalid hai.");
        }


        /* CHECK LOGIN */

        const sessionResult =
            await supabaseClient.auth.getSession();

        if(sessionResult.error){
            throw sessionResult.error;
        }

        if(!sessionResult.data.session){

            location.replace("./login.html");
            return;

        }


        /* FETCH EXAM */

        titleElement.textContent = "Fetching Exam...";

        const examResult = await supabaseClient
            .from("exams")
            .select("id,title,is_published,duration_minutes")
            .eq("id",Number(examId))
            .maybeSingle();

        if(examResult.error){
            throw examResult.error;
        }

        if(!examResult.data){
            throw new Error(
                "Exam nahi mila. Exam ID: " + examId
            );
        }

        exam = examResult.data;

        if(!exam.is_published){
            throw new Error("Ye Exam abhi Published nahi hai.");
        }


        /* SET TITLE */

        titleElement.textContent = exam.title;


        /* SET DURATION */

        const duration = Number(exam.duration_minutes);

        if(!Number.isInteger(duration) ||
           duration < 1 ||
           duration > 300){

            throw new Error(
                "Exam duration invalid hai: " +
                exam.duration_minutes
            );

        }

        timeLeft = duration * 60;

        updateTimer();


        /* FETCH QUESTIONS */

        document.getElementById("questionCount").textContent =
            "Loading Questions...";

        const questionResult =
            await supabaseClient.rpc(
                "get_exam_questions",
                {
                    p_exam_id:Number(exam.id)
                }
            );

        if(questionResult.error){
            throw questionResult.error;
        }

        questions = questionResult.data || [];

        if(!Array.isArray(questions) ||
           questions.length === 0){

            throw new Error(
                "Is Exam mein koi Question nahi mila."
            );

        }


        /* START TEST */

        currentIndex = 0;

        answers = {};

        testArea.style.display = "block";

        showQuestion();

        startTimer();

        errorElement.textContent = "";

    }
    catch(error){

        showError(error);

    }

}


/* SHOW QUESTION */

function showQuestion(){

    if(!questions.length) return;

    const q = questions[currentIndex];

    if(!q){
        showError("Question data missing hai.");
        return;
    }

    document.getElementById("questionCount").textContent =
        "Question " +
        (currentIndex + 1) +
        " / " +
        questions.length;

    document.getElementById("questionText").textContent =
        q.question_text;

    const optionsElement =
        document.getElementById("options");

    optionsElement.innerHTML = "";

    ["A","B","C","D"].forEach(letter=>{

        const value =
            q["option_" + letter.toLowerCase()];

        const label = document.createElement("label");

        label.className = "option";

        const radio = document.createElement("input");

        radio.type = "radio";
        radio.name = "answer";
        radio.value = letter;

        radio.checked = answers[q.id] === letter;

        radio.addEventListener("change",()=>{

            answers[q.id] = letter;

        });

        label.appendChild(radio);

        label.appendChild(
            document.createTextNode(
                letter + ". " + (value || "")
            )
        );

        optionsElement.appendChild(label);

    });

    document.getElementById("previousBtn").disabled =
        currentIndex === 0;

    document.getElementById("nextBtn").disabled =
        currentIndex === questions.length - 1;

}


/* NEXT */

function nextQuestion(){

    if(currentIndex < questions.length - 1){

        currentIndex++;

        showQuestion();

    }

}


/* PREVIOUS */

function previousQuestion(){

    if(currentIndex > 0){

        currentIndex--;

        showQuestion();

    }

}


/* SKIP */

function skipQuestion(){

    nextQuestion();

}


/* TIMER */

function updateTimer(){

    const minutes = Math.floor(timeLeft / 60);

    const seconds = timeLeft % 60;

    timerElement.textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

}


function startTimer(){

    clearInterval(timerInterval);

    updateTimer();

    timerInterval = setInterval(()=>{

        timeLeft--;

        updateTimer();

        if(timeLeft <= 0){

            clearInterval(timerInterval);

            submitTest(true);

        }

    },1000);

}


/* SUBMIT TEST */

async function submitTest(autoSubmit=false){

    if(submitting) return;

    if(!autoSubmit){

        if(!confirm("Kya aap Test Submit karna chahte hain?")){
            return;
        }

    }

    submitting = true;

    clearInterval(timerInterval);

    document.getElementById("submitBtn").disabled = true;

    try{

        const resultData = await supabaseClient.rpc(
            "submit_exam",
            {
                p_exam_id:Number(examId),
                p_answers:answers
            }
        );

        if(resultData.error){
            throw resultData.error;
        }

        const result = Array.isArray(resultData.data)
            ? resultData.data[0]
            : resultData.data;

        if(!result){
            throw new Error("Result receive nahi hua.");
        }

        testArea.style.display = "none";

        document.getElementById("result").style.display = "block";

        document.getElementById("resultDetails").innerHTML = `
            <p>Total Questions: ${result.total_questions}</p>
            <p>Attempted: ${result.attempted_questions}</p>
            <p>Correct Answers: ${result.correct_answers}</p>
            <p>Wrong Answers: ${result.wrong_answers}</p>
            <h3>Score: ${result.score}</h3>
        `;

        titleElement.textContent = "Test Completed";

    }
    catch(error){

        submitting = false;

        document.getElementById("submitBtn").disabled = false;

        showError(error);

    }

}


/* BUTTON EVENTS */

document.getElementById("previousBtn")
    .addEventListener("click",previousQuestion);

document.getElementById("nextBtn")
    .addEventListener("click",nextQuestion);

document.getElementById("skipBtn")
    .addEventListener("click",skipQuestion);

document.getElementById("submitBtn")
    .addEventListener("click",()=>submitTest(false));


/* START */

initTest();

</script>

</body>
</html>
