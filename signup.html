<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExamHub Signup</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>
body{font-family:Arial;background:#f4f6fb;display:flex;justify-content:center;align-items:center;min-height:90vh}
.box{background:white;padding:25px;border-radius:12px;width:300px}
input,button{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
button{background:#2563eb;color:white;border:0;border-radius:6px}
</style>
</head>
<body>

<div class="box">
<h2>Create Account</h2>

<form id="signupForm">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
<button type="submit">Signup</button>
</form>

<p id="message"></p>

<a href="./login.html">Already have an account? Login</a>
<br><br>
<a href="./index.html">Home</a>
</div>

<script>
document.getElementById("signupForm").addEventListener("submit",async(e)=>{
e.preventDefault();

const message=document.getElementById("message");
message.textContent="Creating account...";

try{
const {data,error}=await supabaseClient.auth.signUp({
email:document.getElementById("email").value,
password:document.getElementById("password").value,
options:{
emailRedirectTo:window.location.origin+
window.location.pathname.replace(/[^/]*$/,"")+"index.html"
}
});

if(error){
message.textContent=error.message;
return;
}

if(data.session){
message.textContent="Signup successful!";
window.location.href="./index.html";
}else{
message.textContent="Signup successful! Please check your email for confirmation.";
}

}catch(err){
message.textContent="Error: "+err.message;
}
});
</script>

</body>
</html>
