<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExamHub Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>
body{font-family:Arial;background:#f4f6fb;display:flex;justify-content:center;align-items:center;min-height:90vh}
.box{background:white;padding:25px;border-radius:12px;width:300px}
input,button{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
button{background:#2563eb;color:white;border:0;border-radius:6px}
</style>
</head>
<body>

<div class="box">
<h2>ExamHub Login</h2>

<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<p id="message"></p>

<a href="./signup.html">Create Account</a>
<br><br>
<a href="./index.html">Back to Home</a>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit",async(e)=>{
e.preventDefault();

const message=document.getElementById("message");
message.textContent="Please wait...";

try{
const {data,error}=await supabaseClient.auth.signInWithPassword({
email:document.getElementById("email").value,
password:document.getElementById("password").value
});

if(error){
message.textContent=error.message;
return;
}

window.location.href="./index.html";

}catch(err){
message.textContent="Error: "+err.message;
}
});
</script>

</body>
</html>
