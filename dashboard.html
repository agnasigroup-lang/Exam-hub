<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamHub - Student Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5fa;
    margin: 0;
    padding: 15px;
    color: #222;
}

header {
    background: #173e78;
    color: white;
    padding: 18px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.container {
    max-width: 1000px;
    margin: 20px auto;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 22px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.card {
    border: 1px solid #ddd;
    padding: 16px;
    border-radius: 9px;
}

button {
    background: #1769d2;
    color: white;
    border: none;
    padding: 11px 17px;
    border-radius: 6px;
    cursor: pointer;
}

.logout {
    background: #d93636;
}

.result-card {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.muted {
    color: #666;
    font-size: 14px;
}

.error {
    color: red;
    white-space: pre-wrap;
}

.badge {
    display: inline-block;
    background: #e5f0ff;
    color: #1769d2;
    padding: 5px 9px;
    border-radius: 5px;
}
</style>
</head>

<body>

<header>
    <div>
        <h2>ExamHub Student Dashboard</h2>
        <div id="userEmail"></div>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="section">
        <h2>Available Exams</h2>
        <div id="examList" class="cards">
            Loading Exams...
        </div>
    </div>

    <div class="section">
        <h2>My Results</h2>
        <div id="resultList">
            Loading Results...
        </div>
    </div>

    <p id="error" class="error"></p>

</div>

<script>

async function initDashboard() {

    try {

        const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
            location.href = "./login.html";
            return;
        }

        document.getElementById("userEmail").textContent =
            sessionData.session.user.email;

        await loadExams();
        await loadResults();

    } catch (error) {
        showError(error.message);
    }

}


async function loadExams() {

    const container = document.getElementById("examList");

    const { data, error } = await supabaseClient
        .from("exams")
        .select("id,title,description,class_name,subject,fee")
        .eq("is_published", true)
        .order("id", { ascending: false });

    if (error) throw error;

    container.innerHTML = "";

    if (!data || data.length === 0) {
        container.textContent = "Abhi koi published exam available nahi hai.";
        return;
    }

    data.forEach(exam => {

        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = exam.title;

        const description = document.createElement("p");
        description.textContent = exam.description || "";

        const details = document.createElement("p");
        details.className = "muted";
        details.textContent =
            (exam.class_name || "") + " | " +
            (exam.subject || "");

        const fee = document.createElement("p");
        fee.className = "badge";
        fee.textContent =
            Number(exam.fee || 0) === 0
                ? "FREE TEST"
                : "Fee: ₹" + exam.fee;

        const button = document.createElement("button");
        button.textContent = "Start Test";

        button.onclick = () => {
            location.href =
                "./test.html?exam=" +
                encodeURIComponent(exam.id);
        };

        card.append(title, description, details, fee, button);
        container.appendChild(card);

    });

}


async function loadResults() {

    const container = document.getElementById("resultList");

    const { data, error } = await supabaseClient.rpc(
        "get_my_results"
    );

    if (error) throw error;

    container.innerHTML = "";

    if (!data || data.length === 0) {
        container.textContent =
            "Abhi tak aapne koi Test complete nahi kiya hai.";
        return;
    }

    data.forEach(result => {

        const card = document.createElement("div");
        card.className = "result-card";

        const title = document.createElement("h3");
        title.textContent = result.exam_title;

        const details = document.createElement("p");

        details.textContent =
            "Total Questions: " + result.total_questions +
            " | Attempted: " + result.attempted_questions;

        const score = document.createElement("p");

        score.innerHTML = "";

        const scoreLabel = document.createElement("strong");
        scoreLabel.textContent = "Score: ";

        score.append(
            scoreLabel,
            document.createTextNode(String(result.score))
        );

        const answers = document.createElement("p");
        answers.textContent =
            "Correct: " + result.correct_answers +
            " | Wrong: " + result.wrong_answers;

        const date = document.createElement("p");
        date.className = "muted";

        date.textContent = result.completed_at
            ? "Completed: " +
              new Date(result.completed_at).toLocaleString("en-IN")
            : "";

        card.append(title, details, score, answers, date);
        container.appendChild(card);

    });

}


async function logout() {

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        showError(error.message);
        return;
    }

    location.href = "./login.html";

}


function showError(message) {

    document.getElementById("error").textContent =
        "Error: " + message;

}


initDashboard();

</script>

</body>
</html>
