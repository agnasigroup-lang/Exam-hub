<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIGME TEST - Dashboard</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6fc;
    color: #172033;
}

header {
    background: #07152e;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #ffc629;
}

.logout {
    background: #ffc629;
    color: #07152e;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 1150px;
    margin: 30px auto;
    padding: 15px;
}

.welcome {
    background: linear-gradient(135deg,#07152e,#123b80);
    color: white;
    padding: 30px;
    border-radius: 12px;
    margin-bottom: 30px;
}

.welcome h1 {
    margin-bottom: 10px;
}

.section-title {
    margin-bottom: 20px;
    font-size: 25px;
}

.exam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
    gap: 20px;
}

.exam-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.exam-card h3 {
    font-size: 20px;
    margin-bottom: 12px;
    color: #07152e;
}

.exam-card p {
    margin: 8px 0;
    color: #667085;
    font-size: 14px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    color: #07152e;
    margin: 15px 0;
}

.action-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #07152e;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.action-btn:hover {
    background: #123b80;
}

.paid-btn {
    background: #128348;
}

.paid-btn:hover {
    background: #096b37;
}

.action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
}

.status-paid {
    background: #d9f7e5;
    color: #08733d;
}

.status-free {
    background: #e2eaff;
    color: #1646a0;
}

.status-unpaid {
    background: #fff0d5;
    color: #a45b00;
}

#message {
    padding: 15px;
    margin: 15px 0;
    border-radius: 7px;
    display: none;
    overflow-wrap: anywhere;
}

.error {
    background: #ffe5e5;
    color: #a00000;
}

.success {
    background: #d9f7e5;
    color: #08733d;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #667085;
}

footer {
    text-align: center;
    padding: 25px;
    color: #667085;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        SIGME <span>TEST</span>
    </div>

    <button class="logout" onclick="logoutUser()">
        Logout
    </button>

</header>


<div class="container">

    <div class="welcome">

        <h1>Welcome to SIGME TEST</h1>

        <p id="userEmail">Loading account...</p>

        <p style="margin-top:10px;">
            Your Success, Our Mission
        </p>

    </div>


    <div id="message"></div>


    <h2 class="section-title">
        Available Exams
    </h2>


    <div id="examList" class="exam-grid">

        <div class="loading">
            Loading exams...
        </div>

    </div>

</div>


<footer>
    © <span id="year"></span> SIGME TEST. All Rights Reserved.
</footer>


<script>

let currentUser = null;

let exams = [];

let paidExamIds = new Set();

let paymentStatusLoaded = false;

let paymentCheckError = false;

document.getElementById("year").textContent =
    new Date().getFullYear();


function showMessage(message, type = "error") {

    const box = document.getElementById("message");

    box.style.display = "block";

    box.className = type;

    box.textContent = message;

}


function hideMessage() {

    const box = document.getElementById("message");

    box.style.display = "none";

}


function showLoading(message) {

    document.getElementById("examList").innerHTML =
        `<div class="loading">${message}</div>`;

}


function normalizeId(id) {

    return String(id);

}


// CHECK LOGIN

async function checkLogin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {

        window.location.href = "./login.html";

        return false;

    }

    currentUser = data.session.user;

    document.getElementById("userEmail").textContent =
        currentUser.email || "Logged In";

    return true;

}


// LOAD EXAMS

async function loadExams() {

    showLoading("Loading exams...");

    const { data, error } = await supabaseClient
        .from("exams")
        .select("id,title,description,class_name,subject,fee")
        .order("id", { ascending: false });

    if (error) {

        console.error("EXAM LOAD ERROR:", error);

        showMessage(
            "Exams load nahi ho sake: " + error.message
        );

        showLoading("Unable to load exams.");

        return;

    }

    exams = data || [];

    await loadPaidPayments();

}


// LOAD PREVIOUS PAID TESTS

async function loadPaidPayments() {

    paymentStatusLoaded = false;

    paymentCheckError = false;

    paidExamIds.clear();

    showLoading("Checking your previous purchases...");

    const { data, error } = await supabaseClient
        .from("payments")
        .select("exam_id")
        .eq("user_id", currentUser.id)
        .eq("status", "paid");

    if (error) {

        console.error("PAYMENT HISTORY ERROR:", error);

        paymentCheckError = true;

        showMessage(
            "Payment history check nahi ho paayi. " +
            "Safety ke liye payment buttons abhi band hain. " +
            error.message
        );

        renderExams();

        return;

    }

    (data || []).forEach(payment => {

        paidExamIds.add(
            normalizeId(payment.exam_id)
        );

    });

    paymentStatusLoaded = true;

    renderExams();

}


// CHECK WHETHER TEST IS ALREADY PAID

function isExamPaid(exam) {

    return paidExamIds.has(
        normalizeId(exam.id)
    );

}


// DISPLAY EXAMS

function renderExams() {

    const list = document.getElementById("examList");

    list.innerHTML = "";

    if (!exams.length) {

        list.innerHTML =
            '<div class="loading">No exams available.</div>';

        return;

    }

    exams.forEach(exam => {

        const fee = Number(exam.fee || 0);

        const isFree = fee <= 0;

        const alreadyPaid = isExamPaid(exam);

        let button = "";

        let badge = "";

        if (paymentCheckError) {

            badge = `
                <span class="status status-unpaid">
                    PAYMENT STATUS UNAVAILABLE
                </span>
            `;

            button = `
                <button class="action-btn" disabled>
                    Please Refresh
                </button>
            `;

        }

        else if (isFree) {

            badge = `
                <span class="status status-free">
                    FREE TEST
                </span>
            `;

            button = `
                <button class="action-btn"
                onclick="startTest('${exam.id}')">
                    Start Test
                </button>
            `;

        }

        else if (alreadyPaid) {

            badge = `
                <span class="status status-paid">
                    PAYMENT SUCCESSFUL
                </span>
            `;

            button = `
                <button class="action-btn paid-btn"
                onclick="startTest('${exam.id}')">
                    Start Test
                </button>
            `;

        }

        else {

            badge = `
                <span class="status status-unpaid">
                    PAID TEST
                </span>
            `;

            button = `
                <button class="action-btn"
                onclick="buyTest('${exam.id}')">
                    Pay Now ₹${fee}
                </button>
            `;

        }


        const card = document.createElement("div");

        card.className = "exam-card";

        card.innerHTML = `

            ${badge}

            <h3></h3>

            <p class="description"></p>

            <p class="class-name"></p>

            <p class="subject"></p>

            <div class="price">
                ${isFree ? "FREE" : "₹" + fee}
            </div>

            ${button}

        `;

        card.querySelector("h3").textContent =
            exam.title || "Untitled Exam";

        card.querySelector(".description").textContent =
            exam.description || "";

        card.querySelector(".class-name").textContent =
            "Class: " + (exam.class_name || "N/A");

        card.querySelector(".subject").textContent =
            "Subject: " + (exam.subject || "N/A");

        list.appendChild(card);

    });

}


// START TEST

function startTest(examId) {

    window.location.href =
        "./test.html?exam=" +
        encodeURIComponent(examId);

}


// CREATE PAYMENT ORDER

async function buyTest(examId) {

    hideMessage();

    if (!paymentStatusLoaded || paymentCheckError) {

        showMessage(
            "Payment status verify nahi hua. Please refresh karein."
        );

        return;

    }

    const exam = exams.find(
        item => normalizeId(item.id) === normalizeId(examId)
    );

    if (!exam) {

        showMessage("Exam not found.");

        return;

    }


    // IMPORTANT: CHECK OLD PAYMENT AGAIN

    if (isExamPaid(exam)) {

        showMessage(
            "Aap is test ko pehle hi kharid chuke hain.",
            "success"
        );

        startTest(examId);

        return;

    }


    if (Number(exam.fee || 0) <= 0) {

        startTest(examId);

        return;

    }


    if (typeof Razorpay === "undefined") {

        showMessage("Razorpay Checkout load nahi hua.");

        return;

    }


    const buttons =
        document.querySelectorAll(".action-btn");

    buttons.forEach(btn => btn.disabled = true);


    showMessage("Creating payment order...", "success");


    try {

        const { data: orderData, error: orderError } =
            await supabaseClient.functions.invoke(
                "create-razorpay-order",
                {
                    body: {
                        exam_id: examId
                    }
                }
            );


        if (orderError) {

            throw new Error(orderError.message);

        }


        if (!orderData || !orderData.order_id || !orderData.key_id) {

            throw new Error(
                orderData?.error || "Invalid Razorpay order response."
            );

        }


        const options = {

            key: orderData.key_id,

            amount: orderData.amount,

            currency: orderData.currency || "INR",

            name: "SIGME TEST",

            description: exam.title,

            order_id: orderData.order_id,

            handler: async function(response) {

                await verifyPayment(response);

            },

            modal: {

                ondismiss: function() {

                    showMessage(
                        "Payment cancel hua. Aap baad mein dobara try kar sakte hain."
                    );

                    renderExams();

                }

            },

            theme: {

                color: "#07152e"

            }

        };


        const razorpay = new Razorpay(options);


        razorpay.on("payment.failed", function(response) {

            console.error(
                "PAYMENT FAILED:",
                response.error
            );

            showMessage(
                response.error.description ||
                "Payment failed. Please try again."
            );

            renderExams();

        });


        razorpay.open();

    }

    catch(error) {

        console.error("CREATE ORDER ERROR:", error);

        showMessage(
            "Payment order error: " + error.message
        );

    }

    finally {

        buttons.forEach(btn => btn.disabled = false);

    }

}


// VERIFY PAYMENT

async function verifyPayment(response) {

    showMessage(
        "Payment verify ho raha hai. Please wait...",
        "success"
    );


    try {

        const { data, error } =
            await supabaseClient.functions.invoke(
                "verify-razorpay-payment",
                {
                    body: {

                        razorpay_order_id:
                            response.razorpay_order_id,

                        razorpay_payment_id:
                            response.razorpay_payment_id,

                        razorpay_signature:
                            response.razorpay_signature

                    }
                }
            );


        if (error) {

            throw new Error(error.message);

        }


        if (!data || data.success !== true) {

            throw new Error(
                data?.error || "Payment verification failed."
            );

        }


        showMessage(
            "Payment successful! Your test is unlocked.",
            "success"
        );


        // RELOAD VERIFIED PAYMENT HISTORY

        await loadPaidPayments();


        // OPEN TEST ONLY AFTER SERVER VERIFICATION

        if (paidExamIds.has(
            normalizeId(
                exams.find(e =>
                    normalizeId(e.id) ===
                    normalizeId(data.exam_id)
                )?.id || data.exam_id
            )
        )) {

            startTest(data.exam_id);

        }

        else {

            // Recheck if verification succeeded but exam_id
            // was not included in response.

            const paidNow = exams.find(e =>
                paidExamIds.has(normalizeId(e.id))
            );

            if (paidNow) {

                renderExams();

                showMessage(
                    "Payment successful. Your purchased test is unlocked.",
                    "success"
                );

            } else {

                renderExams();

                showMessage(
                    "Payment verify hua, lekin purchase history refresh nahi hui. Please refresh karein.",
                    "success"
                );

            }

        }

    }

    catch(error) {

        console.error("VERIFY PAYMENT ERROR:", error);

        showMessage(
            "Payment verification error: " + error.message
        );

        await loadPaidPayments();

    }

}


// LOGOUT

async function logoutUser() {

    const { error } =
        await supabaseClient.auth.signOut();

    if (error) {

        showMessage(error.message);

        return;

    }

    window.location.href = "./login.html";

}


// START DASHBOARD

async function initDashboard() {

    const loggedIn = await checkLogin();

    if (!loggedIn) return;

    await loadExams();

}


initDashboard();

</script>

</body>
</html>
