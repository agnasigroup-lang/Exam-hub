<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamHub Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="./config.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: auto;
}
.card {
    background: white;
    padding: 18px;
    margin: 15px 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ddd;
}
button {
    padding: 11px 18px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}
button:disabled {
    opacity: .6;
    cursor: not-allowed;
}
.logout {
    background: #dc2626;
}
.price {
    font-weight: bold;
    color: #15803d;
}
.error {
    color: #dc2626;
}
</style>
</head>

<body>

<div class="container">

<h1>ExamHub Dashboard</h1>

<p>Welcome: <span id="userEmail">Loading...</span></p>

<button class="logout" onclick="logout()">Logout</button>

<h2>Available Exams</h2>
<div id="examList">Loading exams...</div>

<h2>My Results</h2>
<div id="resultList">Loading results...</div>

<p id="message" class="error"></p>

</div>

<script>

let currentUser = null;

function showMessage(message) {
    document.getElementById("message").textContent = message;
}

function addText(parent, tag, text, className) {
    const element = document.createElement(tag);
    element.textContent = text;
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
}

async function initDashboard() {
    try {
        const { data: { session }, error } =
            await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!session) {
            location.href = "./login.html";
            return;
        }

        currentUser = session.user;

        document.getElementById("userEmail").textContent =
            currentUser.email || "";

        await loadExams();
        await loadResults();

    } catch (error) {
        showMessage(error.message);
    }
}

async function loadExams() {
    const examList = document.getElementById("examList");
    examList.textContent = "Loading exams...";

    const { data: exams, error } = await supabaseClient
        .from("exams")
        .select("id,title,description,class_name,subject,fee")
        .eq("is_published", true)
        .order("id", { ascending: false });

    if (error) throw error;

    examList.replaceChildren();

    if (!exams || exams.length === 0) {
        examList.textContent = "No exams available.";
        return;
    }

    const { data: paidPayments, error: paymentError } =
        await supabaseClient
        .from("payments")
        .select("exam_id")
        .eq("user_id", currentUser.id)
        .eq("status", "paid");

    if (paymentError) throw paymentError;

    const paidExamIds = new Set(
        (paidPayments || []).map(payment => String(payment.exam_id))
    );

    exams.forEach(exam => {
        const card = document.createElement("div");
        card.className = "card";

        addText(card, "h3", exam.title || "Untitled Exam");
        addText(card, "p", exam.description || "");
        addText(card, "p",
            "Class: " + (exam.class_name || "-") +
            " | Subject: " + (exam.subject || "-")
        );

        const fee = Number(exam.fee || 0);

        addText(
            card,
            "p",
            fee > 0 ? "Fee: ₹" + fee : "FREE TEST",
            "price"
        );

        const button = document.createElement("button");

        if (fee <= 0 || paidExamIds.has(String(exam.id))) {
            button.textContent = "Start Test";
            button.onclick = () => {
                location.href = "./test.html?exam=" +
                    encodeURIComponent(exam.id);
            };
        } else {
            button.textContent = "Pay Now";
            button.onclick = () => payForExam(exam, button);
        }

        card.appendChild(button);
        examList.appendChild(card);
    });
}

async function payForExam(exam, button) {
    try {
        if (!window.Razorpay) {
            throw new Error("Payment system load nahi hua. Page refresh karein.");
        }

        button.disabled = true;
        button.textContent = "Processing...";

        const { data: orderData, error: orderError } =
            await supabaseClient.functions.invoke(
                "create-razorpay-order",
                {
                    body: {
                        exam_id: exam.id
                    }
                }
            );

        if (orderError) {
    alert("Function Error: " + orderError.message);
    throw orderError;
}

if (!orderData || !orderData.order_id ||
    !orderData.key_id || !orderData.amount) {

    alert(
        "SERVER RESPONSE:\n" +
        JSON.stringify(orderData, null, 2)
    );

    button.disabled = false;
    button.textContent = "Pay Now";
    return;
}
        const options = {
            key: orderData.key_id,
            amount: orderData.amount,
            currency: orderData.currency || "INR",
            name: "ExamHub",
            description: exam.title,
            order_id: orderData.order_id,

            handler: async function(response) {
                try {
                    button.textContent = "Verifying Payment...";

                    const { data: verifyData, error: verifyError } =
                        await supabaseClient.functions.invoke(
                            "verify-razorpay-payment",
                            {
                                body: {
                                    razorpay_order_id:
                                        response.razorpay_order_id,

                                    razorpay_payment_id:
                                        response.razorpay_payment_id,

                                    razorpay_signature:
                                        response.razorpay_signature
                                }
                            }
                        );

                    if (verifyError) throw verifyError;

                    if (!verifyData || verifyData.success !== true) {
                        throw new Error(
                            verifyData?.error ||
                            "Payment verification failed."
                        );
                    }

                    alert("Payment Successful! Ab aap test de sakte hain.");

                    location.href = "./test.html?exam=" +
                        encodeURIComponent(exam.id);

                } catch (error) {
                    alert("Payment verification error: " + error.message);
                    button.disabled = false;
                    button.textContent = "Pay Now";
                    await loadExams();
                }
            },

            modal: {
                ondismiss: function() {
                    button.disabled = false;
                    button.textContent = "Pay Now";
                }
            },

            theme: {
                color: "#2563eb"
            }
        };

        const checkout = new Razorpay(options);

        checkout.on("payment.failed", function(response) {
            alert(
                "Payment Failed: " +
                (response.error.description || "Please try again.")
            );

            button.disabled = false;
            button.textContent = "Pay Now";
        });

        checkout.open();

    } catch (error) {
        alert("Error: " + error.message);
        button.disabled = false;
        button.textContent = "Pay Now";
    }
}

async function loadResults() {
    const resultList = document.getElementById("resultList");
    resultList.textContent = "Loading results...";

    const { data, error } =
        await supabaseClient.rpc("get_my_results");

    if (error) throw error;

    resultList.replaceChildren();

    if (!data || data.length === 0) {
        resultList.textContent = "No results yet.";
        return;
    }

    data.forEach(result => {
        const card = document.createElement("div");
        card.className = "card";

        addText(card, "h3", result.exam_title || "Exam Result");

        addText(card, "p",
            "Total Questions: " + result.total_questions
        );

        addText(card, "p",
            "Attempted: " + result.attempted_questions
        );

        addText(card, "p",
            "Correct: " + result.correct_answers
        );

        addText(card, "p",
            "Wrong: " + result.wrong_answers
        );

        addText(card, "p",
            "Score: " + result.score
        );

        addText(card, "p",
            "Date: " + new Date(result.completed_at).toLocaleString()
        );

        resultList.appendChild(card);
    });
}

async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./login.html";
}

initDashboard();

</script>

</body>
</html>
